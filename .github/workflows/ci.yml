name: CI/CD com Testes E2E

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: finance_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Configurar .env.test
        run: |
          echo "DATABASE_URL=mysql://root:password@127.0.0.1:3306/finance_api_test" > .env.test

      - name: Instalar cliente MySQL
        run: sudo apt-get install -y mysql-client

      - name: Esperar MySQL ficar pronto
        run: |
          echo "🕒 Aguardando MySQL..."
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -u root -ppassword --silent && break
            echo "Tentativa $i... MySQL ainda não está pronto."
            sleep 2
          done
          echo "✅ MySQL está pronto!"

      - name: Aplicar schema ao banco de teste
        run: |
          npx dotenv -e .env.test -- prisma db push

      - name: Executar Testes E2E
        run: npm run test:e2e
        env:
          NODE_ENV: test
